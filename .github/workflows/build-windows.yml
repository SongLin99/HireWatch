name: Build Windows app (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - run: python -m playwright install --only-shell chromium
      - run: python scripts/audit_public_source.py
      - run: python -m pytest -q
      - run: python scripts/build_windows.py
      - run: python scripts/verify_windows_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: HireWatch-Windows-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            release/HireWatch-*-Windows-x64.zip
            release/HireWatch-*-Windows-x64.sha256.txt
            release/windows-smoke-x64.json
