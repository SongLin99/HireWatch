name: Build macOS apps (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official native runner labels; no Rosetta or cross-compilation.
          - runner: macos-15
            architecture: arm64
            label: AppleSilicon
          - runner: macos-15-intel
            architecture: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture == 'arm64' && 'arm64' || 'x64' }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-build-macos.txt
            requirements-dev.txt
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-build-macos.txt
      - name: Regression tests (mocked network and model calls)
        run: |
          python scripts/audit_public_source.py
          python -m pytest -q
      - name: Build native app and symlink-preserving archive
        run: python scripts/build_macos.py --arch ${{ matrix.architecture }}
      - name: Verify unpacked app with empty credentials and no scheduler
        run: python scripts/verify_macos_package.py --arch ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: HireWatch-macOS-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/HireWatch-*-macOS-${{ matrix.label }}.zip
            release/HireWatch-*-macOS-${{ matrix.label }}.sha256.txt
            release/macos-smoke-${{ matrix.architecture }}.json
